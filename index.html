<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同词相遇 - 2-6人实时默契考验</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #ec4899;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1b4b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a5b4fc, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle { color: var(--subtext); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 0.4rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
    input, select {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(15, 23, 42, 0.6);
      color: white;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      text-align: center;
    }
    input:focus { border-color: var(--primary); }
    .grid-players {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin: 1.5rem 0;
    }
    .player-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player-card.ready { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
    .player-card .status { font-size: 0.8rem; color: var(--subtext); margin-top: 4px; }
    .word-badge {
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      margin-top: 8px;
    }
    .topic-box {
      background: rgba(99, 102, 241, 0.15);
      border: 1px dashed var(--primary);
      padding: 1.2rem;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    .hidden { display: none !important; }
    .room-tag {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>同词相遇</h1>
  <p class="subtitle">2-6人异地点对点默契大考验</p>

  <!-- 1. 初始菜单 -->
  <div id="lobby">
    <input type="text" id="nickname" placeholder="请输入你的玩家昵称" />
    
    <div style="margin-bottom: 1.2rem; text-align: left;">
      <label style="font-size: 0.9rem; color: var(--subtext); display: block; margin-bottom: 4px;">选择游戏人数：</label>
      <select id="max-players">
        <option value="2">2 人游戏</option>
        <option value="3">3 人游戏</option>
        <option value="4">4 人游戏</option>
        <option value="5">5 人游戏</option>
        <option value="6">6 人游戏</option>
      </select>
    </div>

    <button class="btn" onclick="createRoom()">创建房间</button>
    <div style="margin: 1rem 0; color: var(--subtext);">—— 或 ——</div>
    <input type="text" id="room-input" placeholder="输入 6 位房间码" style="text-transform: uppercase;" />
    <button class="btn btn-secondary" onclick="joinRoom()">加入房间</button>
  </div>

  <!-- 2. 等待大厅 -->
  <div id="waiting-room" class="hidden">
    <div class="room-tag">房间码: <b id="room-code-display" style="color:#ec4899;">-</b></div>
    <p style="color:var(--subtext); font-size: 0.9rem; margin-bottom: 1rem;">将房间码发给朋友，满人后自动开启游戏</p>
    
    <div id="player-list" class="grid-players"></div>

    <button class="btn btn-secondary" onclick="copyInviteLink()">复制邀请链接</button>
  </div>

  <!-- 3. 游戏主要环节 -->
  <div id="game-room" class="hidden">
    <div class="room-tag">第 <span id="round-num">1</span> 轮</div>
    <div class="topic-box" id="current-topic">准备中...</div>

    <!-- 词语输入界面 -->
    <div id="input-section">
      <input type="text" id="my-word" placeholder="输入你想到的词语..." />
      <button class="btn" onclick="submitWord()">锁定并提交</button>
    </div>

    <!-- 提交后等待 -->
    <div id="waiting-others" class="hidden" style="color: var(--subtext); margin: 1.5rem 0;">
      已提交！正在等待其他玩家锁定...
    </div>

    <!-- 揭晓/决策界面 -->
    <div id="result-section" class="hidden">
      <h3 style="margin-bottom: 1rem;" id="result-title">揭晓时刻</h3>
      <div id="result-grid" class="grid-players"></div>

      <!-- 房主决策按钮（词不相同时显示） -->
      <div id="host-controls" class="hidden" style="margin-top: 1.5rem;">
        <p style="color: var(--subtext); font-size: 0.9rem; margin-bottom: 0.8rem;">作为房主，请选择下一步：</p>
        <button class="btn" onclick="nextRound(true)">继续下一轮（寻找交集桥梁）</button>
        <button class="btn btn-secondary" onclick="endGame()">词相同 / 结束游戏</button>
      </div>

      <div id="client-waiting-host" class="hidden" style="color: var(--subtext); margin-top: 1rem;">
        正在等待房主选择是否继续下一轮...
      </div>
    </div>
  </div>
</div>

<script>
  const TOPICS = [
    "说到“夏天”，你第一个想到的词是？",
    "说到“宵夜”，你最先想到的食物是？",
    "说到“下雨天”，你会想到什么？",
    "说到“假期”，你最想做的一件事是？",
    "说到“红色”，你第一个联想到的物品是？",
    "说到“动物园”，你第一个想看的动物是？"
  ];

  let peer = null;
  let connections = []; // 房主用的连接列表
  let hostConn = null;  // 客户端用的房主连接
  let isHost = false;
  let myName = "";
  let myId = "";
  let targetPlayers = 2;
  
  let currentRound = 1;
  let playersData = {}; // id -> { name, word, ready }
  let lastWords = [];

  // 自动从URL填入房间码
  window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room');
    if (room) {
      document.getElementById('room-input').value = room;
    }
  };

  function generateCode() {
    return Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  // --- 创建房间 (Host) ---
  function createRoom() {
    myName = document.getElementById('nickname').value.trim() || '玩家1';
    targetPlayers = parseInt(document.getElementById('max-players').value);
    const code = generateCode();
    
    peer = new Peer('swg-' + code);

    peer.on('open', (id) => {
      myId = id;
      isHost = true;
      playersData[myId] = { name: myName, word: '', ready: false };

      showWaitingRoom(code);
      updatePlayerList();
    });

    peer.on('connection', (conn) => {
      if (Object.keys(playersData).length >= targetPlayers) {
        conn.send({ type: 'FULL' });
        setTimeout(() => conn.close(), 500);
        return;
      }

      connections.push(conn);

      conn.on('data', (data) => handleDataHost(conn, data));
      conn.on('close', () => {
        delete playersData[conn.peer];
        updatePlayerList();
        broadcast({ type: 'PLAYERS_UPDATE', players: playersData });
      });
    });

    peer.on('error', (err) => alert('创建房间失败: ' + err));
  }

  // --- 加入房间 (Client) ---
  function joinRoom() {
    myName = document.getElementById('nickname').value.trim() || '玩家' + Math.floor(Math.random()*100);
    const code = document.getElementById('room-input').value.trim().toUpperCase();
    
    if (!code) return alert('请输入有效的房间码！');

    peer = new Peer();

    peer.on('open', (id) => {
      myId = id;
      hostConn = peer.connect('swg-' + code);

      hostConn.on('open', () => {
        hostConn.send({ type: 'JOIN', name: myName });
      });

      hostConn.on('data', (data) => handleDataClient(data));
      hostConn.on('close', () => alert('与房主断开连接'));
    });

    peer.on('error', (err) => alert('连接失败，请检查房间码是否正确！'));
  }

  // --- 房主逻辑消息处理 ---
  function handleDataHost(conn, data) {
    if (data.type === 'JOIN') {
      playersData[conn.peer] = { name: data.name, word: '', ready: false };
      
      // 广播最新玩家列表
      broadcast({ type: 'PLAYERS_UPDATE', players: playersData, target: targetPlayers });
      updatePlayerList();

      // 如果人满了，自动开始游戏
      if (Object.keys(playersData).length === targetPlayers) {
        setTimeout(startGame, 1000);
      }
    } else if (data.type === 'SUBMIT_WORD') {
      playersData[conn.peer].word = data.word;
      playersData[conn.peer].ready = true;
      
      broadcast({ type: 'PLAYERS_UPDATE', players: playersData });
      checkAllSubmitted();
    }
  }

  // --- 客户端逻辑消息处理 ---
  function handleDataClient(data) {
    if (data.type === 'FULL') {
      alert('房间已满！');
      return;
    }
    if (data.type === 'PLAYERS_UPDATE') {
      playersData = data.players;
      if (data.target) targetPlayers = data.target;
      
      if (!document.getElementById('waiting-room').classList.contains('hidden')) {
        updatePlayerList();
      }
    } else if (data.type === 'START_GAME') {
      enterGameRoom(data.topic, data.round);
    } else if (data.type === 'REVEAL') {
      showResults(data.words, data.allMatch);
    } else if (data.type === 'END_GAME') {
      alert('游戏结束！大家辛苦啦~');
      location.reload();
    }
  }

  function broadcast(data) {
    connections.forEach(c => c.send(data));
  }

  // --- 界面更新辅助函数 ---
  function showWaitingRoom(code) {
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('waiting-room').classList.remove('hidden');
    document.getElementById('room-code-display').innerText = code;
  }

  function updatePlayerList() {
    const listEl = document.getElementById('player-list');
    listEl.innerHTML = '';
    
    Object.values(playersData).forEach(p => {
      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML = `<strong>${p.name}</strong><span class="status">已就绪</span>`;
      listEl.appendChild(card);
    });
  }

  function copyInviteLink() {
    const code = document.getElementById('room-code-display').innerText;
    const url = `${window.location.origin}${window.location.pathname}?room=${code}`;
    navigator.clipboard.writeText(url);
    alert('邀请链接已复制到剪贴板！');
  }

  // --- 游戏主流程 ---
  function startGame() {
    const topic = TOPICS[Math.floor(Math.random() * TOPICS.length)];
    currentRound = 1;
    
    broadcast({ type: 'START_GAME', topic, round: currentRound });
    enterGameRoom(topic, currentRound);
  }

  function enterGameRoom(topic, round) {
    document.getElementById('waiting-room').classList.add('hidden');
    document.getElementById('game-room').classList.remove('hidden');
    
    document.getElementById('round-num').innerText = round;
    document.getElementById('current-topic').innerText = topic;
    
    document.getElementById('input-section').classList.remove('hidden');
    document.getElementById('waiting-others').classList.add('hidden');
    document.getElementById('result-section').classList.add('hidden');
    document.getElementById('my-word').value = '';
  }

  function submitWord() {
    const word = document.getElementById('my-word').value.trim();
    if (!word) return alert('请输入你的词语！');

    document.getElementById('input-section').classList.add('hidden');
    document.getElementById('waiting-others').classList.remove('hidden');

    if (isHost) {
      playersData[myId].word = word;
      playersData[myId].ready = true;
      checkAllSubmitted();
    } else {
      hostConn.send({ type: 'SUBMIT_WORD', word });
    }
  }

  function checkAllSubmitted() {
    if (!isHost) return;
    
    const allReady = Object.values(playersData).every(p => p.ready);
    if (allReady) {
      const words = Object.values(playersData).map(p => p.word);
      const firstWord = words[0];
      const allMatch = words.every(w => w.toLowerCase() === firstWord.toLowerCase());

      lastWords = words;

      broadcast({ type: 'REVEAL', words: playersData, allMatch });
      showResults(playersData, allMatch);
    }
  }

  function showResults(data, allMatch) {
    document.getElementById('waiting-others').classList.add('hidden');
    document.getElementById('result-section').classList.remove('hidden');

    const grid = document.getElementById('result-grid');
    grid.innerHTML = '';

    Object.values(data).forEach(p => {
      const card = document.createElement('div');
      card.className = 'player-card ready';
      card.innerHTML = `<strong>${p.name}</strong><div class="word-badge">${p.word}</div>`;
      grid.appendChild(card);
    });

    const titleEl = document.getElementById('result-title');

    if (allMatch) {
      titleEl.innerText = "🎉 默契达成！心有灵犀！";
      titleEl.style.color = "#10b981";
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      
      document.getElementById('host-controls').classList.add('hidden');
      document.getElementById('client-waiting-host').classList.add('hidden');
    } else {
      titleEl.innerText = "🤔 词语不同，继续加油！";
      titleEl.style.color = "#ec4899";

      if (isHost) {
        document.getElementById('host-controls').classList.remove('hidden');
        document.getElementById('client-waiting-host').classList.add('hidden');
      } else {
        document.getElementById('host-controls').classList.add('hidden');
        document.getElementById('client-waiting-host').classList.remove('hidden');
      }
    }
  }

  function nextRound(manual = false) {
    if (!isHost) return;

    currentRound++;
    // 清空上一轮答案
    Object.keys(playersData).forEach(id => {
      playersData[id].word = '';
      playersData[id].ready = false;
    });

    // 组合上一轮出现的不同词作为桥梁提示
    const uniqueWords = [...new Set(lastWords)].join(' & ');
    const nextTopic = `寻找交集桥梁：想出一个能把【${uniqueWords}】连接起来的词！`;

    broadcast({ type: 'START_GAME', topic: nextTopic, round: currentRound });
    enterGameRoom(nextTopic, currentRound);
  }

  function endGame() {
    if (!isHost) return;
    broadcast({ type: 'END_GAME' });
    alert('游戏结束！回到主界面');
    location.reload();
  }
</script>
</body>
</html>
