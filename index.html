<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>同詞相遇</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#14161f;--card:#1f2333;--ink:#f1f3fa;--mute:#8a90a8;--accent:#ffb347;--ok:#4ade80;--line:#2f3550}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;padding:20px}
  #app{width:100%;max-width:460px}
  h1{text-align:center;font-size:2rem;margin:10px 0 4px;letter-spacing:.2em}
  .sub{text-align:center;color:var(--mute);margin-bottom:20px;font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  .rules{color:var(--mute);font-size:.9rem;line-height:1.7;padding-left:1.2em;margin:0}
  label{display:block;margin-bottom:10px;color:var(--mute);font-size:.9rem}
  input{width:100%;padding:13px;font-size:1.1rem;border-radius:10px;border:1px solid var(--line);background:#161a28;color:var(--ink);margin-bottom:10px;outline:none}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;padding:15px;font-size:1.1rem;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:#1a1200;cursor:pointer;margin-bottom:10px}
  .btn.ghost{background:#2a3050;color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .round{text-align:center;color:var(--mute);margin-bottom:10px}
  .words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
  .w{padding:10px 16px;border-radius:12px;background:#2a3050;text-align:center;min-width:90px}
  .w small{display:block;color:var(--mute);font-size:.75rem;margin-bottom:2px}
  .w b{font-size:1.3rem;word-break:break-all}
  .w.match{background:#14532d;outline:2px solid var(--ok)}
  .hist{font-size:.85rem;color:var(--mute);line-height:1.8}
  .hist div{border-top:1px solid var(--line);padding:6px 0}
  .win{text-align:center;font-size:2.4rem;margin:10px 0}
  .hint{text-align:center;color:var(--mute);font-size:.9rem;margin:8px 0}
  .code{text-align:center;font-size:2.6rem;font-weight:800;letter-spacing:.3em;color:var(--accent);margin:6px 0 2px}
  .plist .p{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
  .plist .p:first-child{border-top:0}
  .tag{color:var(--mute);font-size:.85rem}
  .tag.ok{color:var(--ok)}
  .err{color:#ff7b7b;text-align:center;min-height:1.4em;font-size:.9rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.trim().toLowerCase().replace(/\s+/g, '');
const PREFIX = 'tongci-meld-';
const MAX = 6, MIN = 2;

let peer = null, isHost = false, roomCode = '';
let hostConn = null;           // guest -> host
let G = null, me = 0;          // latest public state & my index
let myName = localStorage.getItem('tc_name') || '';
let H = null;                  // host-only authoritative state
let draft = '';                // 輸入框草稿，重繪時保留
let draftRound = -1;

/* ---------------- 首頁 ---------------- */
function home(msg) {
  const preset = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  app.innerHTML = `
    <h1>同詞相遇</h1>
    <div class="sub">Mind Meld · 2~6 人 · 線上連線</div>
    <div class="card"><ol class="rules">
      <li>每人心裡想一個詞，同時偷偷提交。</li>
      <li>全員提交後一起揭曉。</li>
      <li>詞不同？就想一個<b>「介於大家的詞之間」</b>的新詞，再來一輪。</li>
      <li>直到所有人寫出同一個詞，輪數越少越厲害！</li>
    </ol></div>
    <div class="card">
      <label>你的名字</label>
      <input id="name" maxlength="8" placeholder="暱稱" value="${esc(myName)}">
      <button class="btn" id="create">建立房間</button>
      <label style="margin-top:6px">或輸入朋友給你的房間碼</label>
      <input id="code" maxlength="4" placeholder="例如 K7QP" value="${esc(preset)}" style="text-transform:uppercase;letter-spacing:.2em;text-align:center">
      <button class="btn ghost" id="join">加入房間</button>
      <div class="err" id="err">${msg ? esc(msg) : ''}</div>
    </div>`;
  const getName = () => {
    const n = document.getElementById('name').value.trim();
    if (!n) { document.getElementById('err').textContent = '請先輸入名字'; return null; }
    myName = n; localStorage.setItem('tc_name', n); return n;
  };
  document.getElementById('create').onclick = () => { const n = getName(); if (n) createRoom(n); };
  document.getElementById('join').onclick = () => {
    const n = getName(); if (!n) return;
    const c = document.getElementById('code').value.trim().toUpperCase();
    if (c.length !== 4) { document.getElementById('err').textContent = '房間碼是 4 個字元'; return; }
    joinRoom(n, c);
  };
}

function setErr(t) { const e = document.getElementById('err'); if (e) e.textContent = t; }
function cleanup() { try { peer && peer.destroy(); } catch (e) {} peer = null; hostConn = null; H = null; G = null; isHost = false; }
function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

/* ---------------- 房主 ---------------- */
function createRoom(name, tries = 0) {
  cleanup();
  setErr('建立中…');
  roomCode = randCode();
  isHost = true;
  peer = new Peer(PREFIX + roomCode);
  peer.on('open', () => {
    H = { players: [{conn: null, name}], phase: 'lobby', round: 1, words: [], history: [] };
    me = 0;
    broadcast();
  });
  peer.on('connection', conn => {
    conn.on('data', msg => hostOnMessage(conn, msg));
    conn.on('close', () => hostOnLeave(conn));
    conn.on('error', () => hostOnLeave(conn));
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 5) return createRoom(name, tries + 1);
    cleanup(); home('連線失敗：' + err.type);
  });
}

function pub() {
  return {
    phase: H.phase, round: H.round, code: roomCode,
    players: H.players.map((p, i) => ({name: p.name, done: H.words[i] != null})),
    history: H.history
  };
}
function broadcast() {
  const s = pub();
  H.players.forEach((p, i) => {
    if (p.conn) { try { p.conn.send({t: 'state', s, you: i}); } catch (e) {} }
  });
  G = s; me = 0; render();
}

function hostOnMessage(conn, msg) {
  if (!msg) return;
  if (msg.t === 'join') {
    if (H.players.some(p => p.conn === conn)) return;
    if (H.phase !== 'lobby') { conn.send({t: 'reject', why: '遊戲已經開始，無法加入'}); return; }
    if (H.players.length >= MAX) { conn.send({t: 'reject', why: '房間已滿（最多 6 人）'}); return; }
    H.players.push({conn, name: String(msg.name || '玩家').slice(0, 8)});
    broadcast();
  } else if (msg.t === 'word') {
    const i = H.players.findIndex(p => p.conn === conn);
    if (i < 0) return;
    submitWord(i, String(msg.w || '').slice(0, 20));
  }
}

function hostOnLeave(conn) {
  const i = H && H.players.findIndex(p => p.conn === conn);
  if (i == null || i < 0) return;
  H.players.splice(i, 1);
  if (H.phase !== 'lobby') {
    H.words.splice(i, 1);
    if (H.players.length < MIN) { resetToLobby(); }
    else if (H.phase === 'input') checkComplete();
  }
  broadcast();
}

function submitWord(i, w) {
  if (!H || H.phase !== 'input' || H.words[i] != null || !w.trim()) return;
  H.words[i] = w.trim();
  checkComplete();
  broadcast();
}

function checkComplete() {
  if (H.phase !== 'input' || H.words.some(w => w == null)) return;
  H.history.push(H.players.map((p, i) => ({n: p.name, w: H.words[i]})));
  const keys = H.words.map(norm);
  H.phase = keys.every(k => k === keys[0]) ? 'win' : 'reveal';
}

function resetToLobby() { H.phase = 'lobby'; H.round = 1; H.words = []; H.history = []; }

function hostStart() {
  if (H.players.length < MIN) return;
  H.phase = 'input'; H.round = 1; H.history = [];
  H.words = Array(H.players.length).fill(null);
  broadcast();
}
function hostNext() {
  H.round++; H.phase = 'input';
  H.words = Array(H.players.length).fill(null);
  broadcast();
}
function hostRestart() { resetToLobby(); broadcast(); }

/* ---------------- 訪客 ---------------- */
function joinRoom(name, code, ) {
  cleanup();
  setErr('連線中…');
  roomCode = code;
  peer = new Peer();
  let opened = false;
  const timer = setTimeout(() => { if (!opened) { cleanup(); home('連線逾時，請確認房間碼或稍後再試'); } }, 15000);
  peer.on('open', () => {
    hostConn = peer.connect(PREFIX + code, {reliable: true});
    hostConn.on('open', () => { opened = true; clearTimeout(timer); hostConn.send({t: 'join', name}); });
    hostConn.on('data', msg => {
      if (msg.t === 'state') { G = msg.s; me = msg.you; render(); }
      else if (msg.t === 'reject') { cleanup(); home(msg.why); }
    });
    hostConn.on('close', () => { if (G) { cleanup(); home('房主已離開，房間關閉'); } });
  });
  peer.on('error', err => {
    clearTimeout(timer);
    const m = err.type === 'peer-unavailable' ? '找不到這個房間' : '連線失敗：' + err.type;
    cleanup(); home(m);
  });
}

/* ---------------- 畫面 ---------------- */
function histHTML(skipLast) {
  const rows = skipLast ? G.history.slice(0, -1) : G.history;
  if (!rows.length) return '';
  return `<div class="card hist"><b style="color:var(--ink)">歷史回顧</b>` +
    rows.map((r, i) => `<div>第 ${i + 1} 輪：` + r.map(x => `${esc(x.n)}「${esc(x.w)}」`).join('　') + `</div>`).join('') + `</div>`;
}
function wordBoxes(row) {
  const keys = row.map(x => norm(x.w));
  const cnt = {}; keys.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
  return `<div class="words">` + row.map((x, i) =>
    `<div class="w ${cnt[keys[i]] > 1 ? 'match' : ''}"><small>${esc(x.n)}</small><b>${esc(x.w)}</b></div>`).join('') + `</div>`;
}
function leaveBtn() { return `<button class="btn ghost" id="leave">離開房間</button>`; }
function bindLeave() {
  const b = document.getElementById('leave');
  if (b) b.onclick = () => { if (confirm('確定離開？')) { cleanup(); home(); } };
}

function render() {
  if (!G) return;
  if (G.phase === 'lobby') return renderLobby();
  if (G.phase === 'input') return renderInput();
  if (G.phase === 'reveal') return renderReveal();
  if (G.phase === 'win') return renderWin();
}

function renderLobby() {
  const link = location.origin + location.pathname + '?room=' + G.code;
  app.innerHTML = `
    <h1>同詞相遇</h1>
    <div class="card">
      <div class="hint" style="margin-top:0">房間碼（分享給朋友）</div>
      <div class="code">${esc(G.code)}</div>
      <button class="btn ghost" id="copy" style="margin-top:14px">複製邀請連結</button>
    </div>
    <div class="card plist">
      <label>玩家 ${G.players.length} / ${MAX}</label>
      ${G.players.map((p, i) => `<div class="p"><span>${esc(p.name)}${i === me ? '（你）' : ''}</span><span class="tag">${i === 0 ? '房主' : ''}</span></div>`).join('')}
    </div>
    ${isHost
      ? `<button class="btn" id="start" ${G.players.length < MIN ? 'disabled' : ''}>${G.players.length < MIN ? '至少需要 2 人' : '開始遊戲'}</button>`
      : `<div class="hint">等待房主開始遊戲…</div>`}
    ${leaveBtn()}`;
  document.getElementById('copy').onclick = e => {
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(
      () => e.target.textContent = '已複製 ✓', () => prompt('複製這個連結：', link));
  };
  if (isHost) document.getElementById('start').onclick = hostStart;
  bindLeave();
}

function renderInput() {
  const meDone = G.players[me] && G.players[me].done;
  const last = G.history[G.history.length - 1];
  if (draftRound !== G.round) { draft = ''; draftRound = G.round; }
  app.innerHTML = `
    <div class="round">第 ${G.round} 輪</div>
    ${last ? `<div class="card"><div class="hint" style="margin-top:0">上一輪大家的詞</div>${wordBoxes(last)}</div>` : ''}
    <div class="card">
      ${meDone
        ? `<div class="hint" style="margin:0 0 10px">你已提交，等待其他人…</div>`
        : `<label>${last ? '想一個介於上面所有詞之間的詞' : '第一輪：隨便想一個詞（越大眾越容易撞上）'}</label>
           <input id="word" maxlength="20" autocomplete="off" placeholder="輸入你的詞">
           <button class="btn" id="ok">提交</button>`}
      <div class="plist">
        ${G.players.map((p, i) => `<div class="p"><span>${esc(p.name)}${i === me ? '（你）' : ''}</span><span class="tag ${p.done ? 'ok' : ''}">${p.done ? '已提交 ✓' : '思考中…'}</span></div>`).join('')}
      </div>
    </div>
    ${histHTML(true)}
    ${leaveBtn()}`;
  if (!meDone) {
    const inp = document.getElementById('word');
    inp.value = draft;
    inp.oninput = () => { draft = inp.value; };
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    const submit = () => {
      const v = inp.value.trim(); if (!v) return;
      draft = '';
      if (isHost) submitWord(0, v); else hostConn.send({t: 'word', w: v});
    };
    document.getElementById('ok').onclick = submit;
    inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
  }
  bindLeave();
}

function renderReveal() {
  const last = G.history[G.history.length - 1];
  app.innerHTML = `
    <div class="round">第 ${G.round} 輪結果</div>
    <div class="card">${wordBoxes(last)}
      <div class="hint">綠色 = 已經撞詞。<br>語音討論一下，下一輪想一個「介於這些詞之間」的詞！</div></div>
    ${isHost ? `<button class="btn" id="next">下一輪</button>` : `<div class="hint">等待房主開始下一輪…</div>`}
    ${histHTML(true)}
    ${leaveBtn()}`;
  if (isHost) document.getElementById('next').onclick = hostNext;
  bindLeave();
}

function renderWin() {
  const last = G.history[G.history.length - 1];
  app.innerHTML = `
    <div class="win">🎉</div>
    <h1 style="letter-spacing:.1em">心有靈犀！</h1>
    <div class="sub">全員同詞，共用了 ${G.round} 輪</div>
    <div class="card">${wordBoxes(last)}</div>
    ${histHTML(true)}
    ${isHost ? `<button class="btn" id="again">再玩一局</button>` : `<div class="hint">等待房主開啟新一局…</div>`}
    ${leaveBtn()}`;
  if (isHost) document.getElementById('again').onclick = hostRestart;
  bindLeave();
}

home();
</script>
</body>
</html>
